<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1a1a1a" stroke="#c75a2a" stroke-width="1"/>
  
  <!-- Circuit board pattern - central chip -->
  <rect x="10" y="10" width="12" height="12" rx="1.5" fill="none" stroke="#c75a2a" stroke-width="1.5"/>
  
  <!-- Inner chip detail -->
  <rect x="13" y="13" width="6" height="6" rx="0.5" fill="#c75a2a" opacity="0.3"/>
  <circle cx="16" cy="16" r="1.5" fill="#c75a2a"/>
  
  <!-- Circuit traces - top -->
  <line x1="12" y1="10" x2="12" y2="4" stroke="#c75a2a" stroke-width="1.2"/>
  <line x1="16" y1="10" x2="16" y2="5" stroke="#c75a2a" stroke-width="1.2"/>
  <line x1="20" y1="10" x2="20" y2="4" stroke="#c75a2a" stroke-width="1.2"/>
  
  <!-- Circuit traces - bottom -->
  <line x1="12" y1="22" x2="12" y2="28" stroke="#c75a2a" stroke-width="1.2"/>
  <line x1="16" y1="22" x2="16" y2="27" stroke="#c75a2a" stroke-width="1.2"/>
  <line x1="20" y1="22" x2="20" y2="28" stroke="#c75a2a" stroke-width="1.2"/>
  
  <!-- Circuit traces - left -->
  <line x1="10" y1="12" x2="4" y2="12" stroke="#c75a2a" stroke-width="1.2"/>
  <line x1="10" y1="16" x2="5" y2="16" stroke="#c75a2a" stroke-width="1.2"/>
  <line x1="10" y1="20" x2="4" y2="20" stroke="#c75a2a" stroke-width="1.2"/>
  
  <!-- Circuit traces - right -->
  <line x1="22" y1="12" x2="28" y2="12" stroke="#c75a2a" stroke-width="1.2"/>
  <line x1="22" y1="16" x2="27" y2="16" stroke="#c75a2a" stroke-width="1.2"/>
  <line x1="22" y1="20" x2="28" y2="20" stroke="#c75a2a" stroke-width="1.2"/>
  
  <!-- Circuit nodes (solder points) -->
  <circle cx="12" cy="4" r="1.2" fill="#c75a2a"/>
  <circle cx="20" cy="4" r="1.2" fill="#c75a2a"/>
  <circle cx="16" cy="5" r="1.2" fill="#c75a2a"/>
  
  <circle cx="12" cy="28" r="1.2" fill="#c75a2a"/>
  <circle cx="20" cy="28" r="1.2" fill="#c75a2a"/>
  <circle cx="16" cy="27" r="1.2" fill="#c75a2a"/>
  
  <circle cx="4" cy="12" r="1.2" fill="#c75a2a"/>
  <circle cx="4" cy="20" r="1.2" fill="#c75a2a"/>
  <circle cx="5" cy="16" r="1.2" fill="#c75a2a"/>
  
  <circle cx="28" cy="12" r="1.2" fill="#c75a2a"/>
  <circle cx="28" cy="20" r="1.2" fill="#c75a2a"/>
  <circle cx="27" cy="16" r="1.2" fill="#c75a2a"/>
</svg>
